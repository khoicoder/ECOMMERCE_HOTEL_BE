spring:
  application:
    name: BE
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:shared}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hotel?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 30000
      pool-name: HotelHikariCP

  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: ${SPRING_JPA_OPEN_IN_VIEW:true}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:12345678901234567890123456789012}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  multitenancy:
    mode: ${APP_MULTITENANCY_MODE:shared}
    default-tenant: ${APP_DEFAULT_TENANT:DEFAULT}

logging:
  file:
    name: logs/application.log
  logback:
    rollingpolicy:
        # Định dạng tên file sau khi rotate (lưu theo ngày và số thứ tự)
      file-name-pattern: logs/archived/app-%d{yyyy-MM-dd}.%i.log.gz

        # Dung lượng tối đa của MỖI file trước khi tách file mới (vd: 10MB)
      max-file-size: 10MB

        # TỔNG dung lượng tối đa của tất cả các file log lưu trữ (vd: 1GB)
        # Khi vượt quá ngưỡng này, Logback sẽ tự xoá log cũ nhất
      total-size-cap: 1GB

        # Số ngày lưu trữ tối đa trước khi xoá
      max-history: 30

        # Xoá log cũ ngay khi ứng dụng khởi động nếu vượt ngưỡng
      clean-history-on-start: true

# Spring Boot Actuator & Micrometer Configuration
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
    metrics:
      enabled: true
    info:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name:hotel-backend}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s
    enable:
      jvm: true
      process: true
      system: true
      hikaricp: true
      redis: true
    log-storage:
      refresh-rate-ms: 30000
