spring:
  application:
    name: BE

  datasource:
    url: jdbc:mysql://localhost:3306/hotel?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

jwt:
  secret: 12345678901234567890123456789012
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
